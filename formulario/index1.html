<!DOCTYPE html>
<html lang="es" id="html-doc">
<head id="head-doc">
    <meta charset="UTF-8" id="meta-charset">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" id="meta-viewport">
    <title id="titulo-pagina">Formulario</title>
    <link rel="stylesheet" href="formulario/css/formulario.css" id="estilos-css">
</head>
<body id="cuerpo-pagina">
    <div>
        <header id="cabecera-principal">
            <h1 id="titulo-principal">FORMULARIO</h1>
        </header>
    </div>

    <main id="contenido-principal">
        <div>
            <form id="formulario-registro" action="#" method="POST">
            
                <div id="grupo-nombre" class="form-group">
                    <label id="label-nombre" for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
                </div>

                <div id="grupo-apellido" class="form-group">
                    <label id="label-apellido" for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Apellidos" required>
                </div>

                <div id="grupo-tipo-identificacion" class="form-group">
                    <label id="label-tipo-identificacion" for="tipo_identificacion">Tipo de identificación:</label>
                    <select id="tipo_identificacion" name="tipo_identificacion"  required>
                        <option value="" disable >Seleccione...</option>
                        <option id="opcion-cc" value="13" selected>Cédula de ciudadanía</option>
                        <option id="opcion-ti" value="12">Tarjeta de identidad</option>
                        <option id="opcion-ce" value="21">Cédula de extranjería</option>
                        <option id="opcion-pe" value="41">Pasaporte</option>
                    </select>
                </div>

                <div id="grupo-num-identificacion" class="form-group">
                    <label id="label-num-identificacion" for="numero_identificacion">Número de identificación:</label>
                    <input type="text" id="numero_identificacion" name="numero_identificacion" placeholder="Su número de identificación" required>
                </div>

                <div id="grupo-nacimiento" class="form-group">
                    <label id="label-nacimiento" for="nacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="nacimiento" name="nacimiento" required>
                </div>

                <div id="grupo-celular" class="form-group">
                    <label id="label-celular" for="celular">Número de celular:</label>
                    <input type="tel" id="celular" name="celular" placeholder="Su número de celular" required>
                </div>

                <div id="grupo-correo" class="form-group">
                    <label id="label-correo" for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="Su correo electrónico" required>
                </div>

                <div id="grupo-pais" class="form-group">
                    <label id="label-pais" for="pais">País de domicilio:</label>
                    <input type="text" id="pais" name="pais" placeholder="Su país de residencia" required>
                </div>

                <div id="grupo-ciudad" class="form-group">
                <label id="label-ciudad" for="ciudad">Ciudad de domicilio:</label>
                <input type="text" id="ciudad" name="ciudad" placeholder="Su ciudad de residencia" required>
                </div>
        
                <div id="grupo-tratamiento-datos" class="form-group">
                    <h4 id="titulo-tratamiento">Tratamiento de datos personales.</h4>
                    <a id="enlace-terminos" href="https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=49981" target="_blank">Términos y condiciones</a>
                
                    <div id="grupo-checkbox">
                        <input type="checkbox" id="tratamiento_datos" name="tratamiento_datos">
                        <label id="label-tratamiento" for="tratamiento_datos">Acepto el tratamiento de mis datos personales después de haber leído los términos y condiciones</label>
                    </div>
                </div>

                <div id="grupo-boton-enviar" class="form-group">
                    <input type="submit" id="boton-enviar" value="Enviar">
                </div>

            </form>
        </div>
        
    </main>

</body>
</html>
</html>
